name: API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: editflow
          POSTGRES_PASSWORD: editflow
          POSTGRES_DB: editflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U editflow -d editflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg for real render integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install API dependencies
        run: pip install -r apps/api/requirements.txt
      - name: Apply database migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://editflow:editflow@localhost:5432/editflow_test
        run: alembic upgrade head
      - name: Run PostgreSQL and media integration tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://editflow:editflow@localhost:5432/editflow_test
        run: pytest -q
