name: API tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: editflow
          POSTGRES_PASSWORD: editflow
          POSTGRES_DB: editflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U editflow -d editflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify FFmpeg is available on the GitHub-hosted runner
        run: |
          command -v ffmpeg
          ffmpeg -version
      - name: Install API dependencies
        run: pip install -r apps/api/requirements.txt
      - name: Apply database migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://editflow:editflow@localhost:5432/editflow_test
        run: alembic upgrade head
      - name: Set up Node.js for Story Graph Explorer
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Build Story Graph Explorer
        working-directory: apps/web
        run: npm run build
      - name: Run Story Graph Explorer browser tests
        working-directory: apps/web
        run: npm run test:e2e
      - name: Run PostgreSQL and media integration tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://editflow:editflow@localhost:5432/editflow_test
        run: pytest -q
