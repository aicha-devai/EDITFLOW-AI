name: API tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: editflow
          POSTGRES_PASSWORD: editflow
          POSTGRES_DB: editflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U editflow -d editflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: pip install -r apps/api/requirements.txt
      - name: Install FFmpeg and FFprobe for real media integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
          ffmpeg -encoders | grep -q libx264
      - name: Apply database migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://editflow:editflow@localhost:5432/editflow_test
        run: alembic upgrade head
      - name: Set up Node.js for Story Graph Explorer
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Build Story Graph Explorer
        working-directory: apps/web
        run: npm run build
      - name: Run Story Graph Explorer browser tests
        working-directory: apps/web
        env:
          EDITFLOW_STAGING_URL: ${{ secrets.EDITFLOW_STAGING_URL }}
          EDITFLOW_E2E_EMAIL: ${{ secrets.EDITFLOW_E2E_EMAIL }}
          EDITFLOW_E2E_PASSWORD: ${{ secrets.EDITFLOW_E2E_PASSWORD }}
        run: npm run test:e2e
      - name: Compile API, tests, and operational scripts
        working-directory: apps/api
        run: python -m compileall -q app scripts tests
      - name: Run PostgreSQL and media integration tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://editflow:editflow@localhost:5432/editflow_test
        run: pytest -q

  container-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image from its production Dockerfile
        run: docker build --pull -t editflow-api:sbom ./apps/api

      - name: Prepare SBOM output directory
        run: mkdir -p sbom

      - name: Generate CycloneDX SBOM for the built API image
        uses: anchore/sbom-action@v0
        with:
          image: editflow-api:sbom
          format: cyclonedx-json
          output-file: sbom/editflow-api.cdx.json
          upload-artifact: false

      - name: Capture FFmpeg build configuration and OS package versions
        run: |
          docker run --rm --entrypoint sh editflow-api:sbom -c 'set -eu
            echo "=== FFmpeg version ==="
            ffmpeg -version
            echo "=== FFmpeg build configuration ==="
            ffmpeg -buildconf
            echo "=== FFprobe version ==="
            ffprobe -version
            echo "=== Installed Debian packages ==="
            dpkg-query -W | sort
          ' > sbom/container-runtime-and-licenses.txt

      - name: Preserve Debian package copyright and license files
        run: |
          docker run --rm -v "$PWD/sbom:/out" --entrypoint sh editflow-api:sbom -c 'set -eu
            find /usr/share/doc -type f -name copyright -print0 | tar --null -czf /out/debian-copyright-files.tar.gz --files-from -
          '

      - name: Build the web production build stage
        run: docker build --pull --target build -t editflow-web-build:sbom ./apps/web

      - name: Generate CycloneDX SBOM for web build dependencies
        uses: anchore/sbom-action@v0
        with:
          image: editflow-web-build:sbom
          format: cyclonedx-json
          output-file: sbom/editflow-web-build.cdx.json
          upload-artifact: false

      - name: Capture exact npm dependency tree and build tool versions
        run: |
          docker run --rm --entrypoint sh editflow-web-build:sbom -c 'set -eu
            node --version
            npm --version
            npm ls --all --json || true
          ' > sbom/web-build-dependencies.json

      - name: Build the web production runtime image
        run: docker build --pull -t editflow-web:sbom ./apps/web

      - name: Generate CycloneDX SBOM for web runtime image
        uses: anchore/sbom-action@v0
        with:
          image: editflow-web:sbom
          format: cyclonedx-json
          output-file: sbom/editflow-web-runtime.cdx.json
          upload-artifact: false

      - name: Capture Nginx and Alpine runtime package versions
        run: |
          docker run --rm --entrypoint sh editflow-web:sbom -c 'set -eu
            nginx -v
            cat /etc/alpine-release
            apk info -vv | sort
          ' > sbom/web-runtime-and-os-packages.txt

      - name: Preserve Alpine package license files
        run: |
          docker run --rm -v "$PWD/sbom:/out" --entrypoint sh editflow-web:sbom -c 'set -eu
            find /usr/share -type f \( -iname "license*" -o -iname "copyright*" -o -iname "copying*" \) -print0 | tar --null -czf /out/alpine-license-files.tar.gz --files-from -
          '

      - name: Create API license metadata inventory
        run: python tools/sbom_license_inventory.py sbom/editflow-api.cdx.json sbom/api-license-inventory.csv

      - name: Create web build license metadata inventory
        run: python tools/sbom_license_inventory.py sbom/editflow-web-build.cdx.json sbom/web-build-license-inventory.csv

      - name: Create web runtime license metadata inventory
        run: python tools/sbom_license_inventory.py sbom/editflow-web-runtime.cdx.json sbom/web-runtime-license-inventory.csv

      - name: Upload SBOM and review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: editflow-full-stack-sbom-${{ github.sha }}
          path: sbom/
          if-no-files-found: error
          retention-days: 30
