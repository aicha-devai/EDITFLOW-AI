# Production overlay. Supply secrets through the deployment secret manager / environment.
# Example: docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --build
services:
  postgres:
    ports: []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the secret manager}
    restart: unless-stopped

  api:
    ports: []
    environment:
      EDITFLOW_ENV: production
      EDITFLOW_EMAIL_PUBLIC_URL: ${EDITFLOW_EMAIL_PUBLIC_URL:?Set the public HTTPS URL}
      EDITFLOW_CORS_ORIGINS: ${EDITFLOW_CORS_ORIGINS:?Set the exact HTTPS frontend origin}
      DATABASE_URL: ${DATABASE_URL:?Set managed PostgreSQL URL with TLS}
      EDITFLOW_AUTH_SECRET: ${EDITFLOW_AUTH_SECRET:?Set a strong auth secret}
      EDITFLOW_STORAGE_BACKEND: s3
      S3_BUCKET: ${S3_BUCKET:?Set production S3 bucket}
      EDITFLOW_EMAIL_SMTP_HOST: ${EDITFLOW_EMAIL_SMTP_HOST:?Set SMTP host}
      EDITFLOW_EMAIL_SMTP_PORT: ${EDITFLOW_EMAIL_SMTP_PORT:-587}
      EDITFLOW_EMAIL_SMTP_USERNAME: ${EDITFLOW_EMAIL_SMTP_USERNAME:?Set SMTP username}
      EDITFLOW_EMAIL_SMTP_PASSWORD: ${EDITFLOW_EMAIL_SMTP_PASSWORD:?Set SMTP password}
      EDITFLOW_EMAIL_FROM: ${EDITFLOW_EMAIL_FROM:?Set verified sender}
      EDITFLOW_EMAIL_USE_SSL: ${EDITFLOW_EMAIL_USE_SSL:-false}
      EDITFLOW_EMAIL_STARTTLS: ${EDITFLOW_EMAIL_STARTTLS:-true}
    restart: unless-stopped

  render-worker:
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set managed PostgreSQL URL with TLS}
      EDITFLOW_STORAGE_BACKEND: s3
      S3_BUCKET: ${S3_BUCKET:?Set production S3 bucket}
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    image: editflow-web:production
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
    restart: unless-stopped
