# Standalone production topology. No development database or published API ports.
# Place TLS certificates at deploy/tls/fullchain.pem and deploy/tls/privkey.pem.
# Inject every secret via the host's secret manager / protected environment.
# docker compose -f docker-compose.production.yml up -d --build
services:
  api:
    build:
      context: ./apps/api
    environment: &editflow_runtime
      EDITFLOW_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set managed PostgreSQL URL with TLS}
      EDITFLOW_AUTH_SECRET: ${EDITFLOW_AUTH_SECRET:?Set a strong auth secret}
      EDITFLOW_EMAIL_PUBLIC_URL: ${EDITFLOW_EMAIL_PUBLIC_URL:?Set public HTTPS URL}
      EDITFLOW_CORS_ORIGINS: ${EDITFLOW_CORS_ORIGINS:?Set exact HTTPS frontend origin}
      EDITFLOW_EMAIL_SMTP_HOST: ${EDITFLOW_EMAIL_SMTP_HOST:?Set SMTP host}
      EDITFLOW_EMAIL_SMTP_PORT: ${EDITFLOW_EMAIL_SMTP_PORT:-587}
      EDITFLOW_EMAIL_SMTP_USERNAME: ${EDITFLOW_EMAIL_SMTP_USERNAME:?Set SMTP username}
      EDITFLOW_EMAIL_SMTP_PASSWORD: ${EDITFLOW_EMAIL_SMTP_PASSWORD:?Set SMTP password}
      EDITFLOW_EMAIL_FROM: ${EDITFLOW_EMAIL_FROM:?Set verified sender address}
      EDITFLOW_EMAIL_USE_SSL: ${EDITFLOW_EMAIL_USE_SSL:-false}
      EDITFLOW_EMAIL_STARTTLS: ${EDITFLOW_EMAIL_STARTTLS:-true}
      EDITFLOW_STORAGE_BACKEND: s3
      S3_BUCKET: ${S3_BUCKET:?Set production S3 bucket}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  render-worker:
    build:
      context: ./apps/api
    command: ["python", "-m", "app.worker_main"]
    environment:
      <<: *editflow_runtime
      EDITFLOW_WORK_ROOT: /tmp/editflow-work
      WORKER_POLL_SECONDS: "2"
      RENDER_TIMEOUT_SECONDS: "3600"
      RENDER_LEASE_SECONDS: "120"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    image: editflow-web:production
    expose:
      - "80"
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
    restart: unless-stopped
